[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-mouse-recorder"
description = "Windows desktop region screen recorder with structured mouse activity logs and frame sampling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dynamic = ["version"]
dependencies = [
    "openpyxl>=3.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime==1.4.4; python_version < '3.13'",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "pyinstaller>=6.0",
]

[project.scripts]
screen-mouse-recorder = "screen_mouse_recorder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "screen_mouse_recorder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
